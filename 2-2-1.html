<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستر عبدو برمجة - تقنيات التشفير والمصادقة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #e8ecf1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .presentation-container {
            width: 1366px;
            max-width: 98vw;
            height: 768px;
            max-height: 98vh;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .cover-decoration {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            opacity: 0.04;
            font-family: 'Cairo', sans-serif;
            color: #1e293b;
            font-size: 14px;
            line-height: 2;
        }

        .cover-decoration.top-right {
            top: 30px;
            right: 40px;
            text-align: right;
            font-size: 13px;
            opacity: 0.05;
        }

        .cover-decoration.bottom-left {
            bottom: 30px;
            left: 40px;
            font-size: 13px;
            opacity: 0.05;
        }

        .slide-content {
            position: relative;
            z-index: 1;
            flex: 1;
            padding: 28px 48px 20px 48px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .trainer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 3px solid #f0f2f5;
            flex-shrink: 0;
        }

        .trainer-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .trainer-avatar {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: linear-gradient(135deg, #1e293b, #f59e0b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            font-weight: 900;
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.3);
            border: 3px solid #f59e0b;
        }

        .trainer-details h4 {
            color: #1e293b;
            font-size: 22px;
            font-weight: 900;
            line-height: 1.2;
        }

        .trainer-details h4 span {
            color: #f59e0b;
        }

        .trainer-details .sub {
            color: #6b7280;
            font-size: 16px;
            font-weight: 400;
            margin-top: 2px;
        }

        .trainer-details .sub i {
            color: #f59e0b;
            margin-left: 6px;
        }

        .slide-counter {
            color: #9ca3af;
            font-size: 18px;
            font-weight: 700;
            background: #f3f4f6;
            padding: 6px 22px;
            border-radius: 24px;
            font-family: 'Cairo', sans-serif;
        }

        .slide-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 6px 0;
        }

        .slide-title {
            font-size: 40px;
            font-weight: 900;
            color: #1e293b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .slide-title .icon {
            font-size: 38px;
        }

        .slide-title .highlight {
            color: #f59e0b;
        }

        .slide-title .subtitle-line {
            font-size: 18px;
            font-weight: 400;
            color: #9ca3af;
            margin-right: 14px;
        }

        .divider {
            width: 80px;
            height: 5px;
            background: linear-gradient(90deg, #f59e0b, #1e293b);
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 26px 32px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
            border: 1px solid #f0f2f5;
        }

        .card:hover {
            box-shadow: 0 10px 40px rgba(245, 158, 11, 0.08);
            transform: translateY(-2px);
            border-color: #f59e0b;
        }

        .card p,
        .card li {
            color: #1f2937;
            font-size: 24px;
            line-height: 2;
        }

        .card ul {
            list-style: none;
            padding: 0;
        }

        .card ul li {
            padding: 6px 0;
            padding-right: 34px;
            position: relative;
            font-size: 23px;
        }

        .card ul li::before {
            content: "▸";
            position: absolute;
            right: 0;
            color: #f59e0b;
            font-weight: 700;
            font-size: 26px;
        }

        .example-box {
            background: #fffbeb;
            border-radius: 16px;
            padding: 18px 24px;
            margin-top: 14px;
            border-right: 5px solid #f59e0b;
        }

        .example-box .label {
            color: #6b7280;
            font-size: 18px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        .example-box .content {
            color: #1f2937;
            font-size: 22px;
            line-height: 1.8;
        }

        .punchline {
            margin-top: 16px;
            padding: 14px 22px;
            background: #fffbeb;
            border-radius: 14px;
            border-right: 5px solid #f59e0b;
            font-size: 24px;
            color: #1e293b;
            font-weight: 700;
        }

        .punchline i {
            color: #f59e0b;
            margin-left: 12px;
            font-size: 26px;
        }

        .concept-map {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 0;
        }

        .concept-map .node {
            background: #fffbeb;
            padding: 10px 30px;
            border-radius: 14px;
            border: 2px solid #fde68a;
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            transition: all 0.3s ease;
            min-width: 200px;
            text-align: center;
        }

        .concept-map .node:hover {
            border-color: #f59e0b;
            background: #fde68a;
        }

        .concept-map .node.highlight {
            border-color: #f59e0b;
            background: #fde68a;
        }

        .concept-map .arrow {
            color: #f59e0b;
            font-size: 28px;
            opacity: 0.6;
        }

        .concept-map .row {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 12px;
            border-radius: 14px;
            border: 1px solid #f0f2f5;
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 17px;
            font-family: 'Cairo', sans-serif;
        }

        .table-wrapper thead {
            background: #f59e0b;
            color: #fff;
        }

        .table-wrapper th {
            padding: 12px 16px;
            text-align: center;
            font-size: 17px;
            font-weight: 800;
            border: 1px solid #f59e0b;
        }

        .table-wrapper td {
            padding: 10px 14px;
            text-align: center;
            border: 1px solid #e5e7eb;
            color: #1f2937;
            font-size: 16px;
            line-height: 1.6;
        }

        .table-wrapper tr:nth-child(even) {
            background: #fffbeb;
        }

        .table-wrapper tr:hover {
            background: #fde68a;
        }

        /* ===== IMAGE PLACEHOLDER ===== */
        .image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border: 2px dashed #d1d5db;
            border-radius: 16px;
            padding: 16px;
            margin-top: 12px;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .image-placeholder img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }

        .image-placeholder .label {
            color: #9ca3af;
            font-size: 14px;
            margin-top: 8px;
        }

        .image-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        /* ===== TWO COL ===== */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 10px;
        }

        .two-col .card {
            height: 100%;
        }

        .two-col .card h4 {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== THREE COL ===== */
        .three-col {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-top: 10px;
        }

        .three-col .card {
            height: 100%;
        }

        .three-col .card h4 {
            font-size: 18px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 8px;
            text-align: center;
        }

        .three-col .card .desc {
            font-size: 15px;
            color: #4b5563;
            line-height: 1.7;
            text-align: center;
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 3px solid #f0f2f5;
            flex-shrink: 0;
        }

        .dots {
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #d1d5db;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            background: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
            width: 36px;
            border-radius: 8px;
        }

        .dot:hover {
            background: #f59e0b;
            opacity: 0.6;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 10px 22px;
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            background: #e5e7eb;
            border-color: #f59e0b;
            color: #1e293b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .btn-primary {
            background: #1e293b;
            border: none;
            color: #fff;
        }

        .btn-primary:hover {
            background: #f59e0b;
            color: #fff;
            box-shadow: 0 6px 24px rgba(245, 158, 11, 0.3);
        }

        .btn-icon {
            width: 48px;
            height: 48px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
            font-size: 18px;
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-enter {
            animation: slideEnter 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes slideEnter {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .slide-content::-webkit-scrollbar {
            width: 5px;
        }
        .slide-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .slide-content::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }

        /* ===== NOTE BOXES ===== */
        .note-box {
            background: #fef2f2;
            border-radius: 12px;
            padding: 12px 18px;
            margin-top: 10px;
            border-right: 4px solid #ef4444;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .note-box .icon {
            font-size: 22px;
            flex-shrink: 0;
        }

        .note-box .content {
            font-size: 17px;
            color: #1f2937;
            line-height: 1.7;
        }

        .note-box .content strong {
            color: #ef4444;
        }

        .note-box.tip {
            background: #eff6ff;
            border-right-color: #3b82f6;
        }

        .note-box.tip .content strong {
            color: #3b82f6;
        }

        .note-box.tech {
            background: #f0fdf4;
            border-right-color: #22c55e;
        }

        .note-box.tech .content strong {
            color: #22c55e;
        }

        .note-box.warn {
            background: #fff7ed;
            border-right-color: #f97316;
        }

        .note-box.warn .content strong {
            color: #f97316;
        }

        /* ===== STEPS ===== */
        .steps-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-top: 10px;
        }

        .step-item {
            background: #fffbeb;
            padding: 18px 20px;
            border-radius: 14px;
            border-right: 4px solid #f59e0b;
            transition: all 0.3s ease;
            position: relative;
        }

        .step-item:hover {
            background: #fde68a;
            transform: translateY(-3px);
        }

        .step-item .step-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: #f59e0b;
            color: #fff;
            border-radius: 50%;
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .step-item .step-title {
            font-size: 18px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .step-item .step-desc {
            font-size: 15px;
            color: #4b5563;
            line-height: 1.7;
        }

        .step-item .step-mech {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            background: #f59e0b;
            color: #fff;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        /* Quiz Styles */
        .quiz-section-title {
            font-size: 32px;
            font-weight: 900;
            color: #1e293b;
            text-align: center;
            margin-bottom: 16px;
        }

        .quiz-section-title .icon {
            font-size: 36px;
        }

        .quiz-section-title .sub {
            font-size: 18px;
            color: #6b7280;
            font-weight: 400;
            display: block;
            margin-top: 4px;
        }

        .quiz-item {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px 26px;
            margin-bottom: 16px;
            border: 2px solid #eef2f6;
            transition: all 0.3s ease;
            position: relative;
        }

        .quiz-item:last-child {
            margin-bottom: 0;
        }

        .quiz-item:hover {
            border-color: #f59e0b;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.08);
        }

        .quiz-item .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .quiz-item .question-text {
            font-size: 20px;
            color: #1e293b;
            font-weight: 700;
            line-height: 1.8;
            flex: 1;
        }

        .quiz-item .question-text .q-num {
            color: #f59e0b;
            font-weight: 900;
            margin-left: 8px;
        }

        .quiz-item .question-text .sub-q {
            font-weight: 400;
            color: #4b5563;
            font-size: 18px;
            display: block;
            padding-right: 30px;
            margin-top: 4px;
        }

        .quiz-item .question-text .sub-q .letter {
            color: #f59e0b;
            font-weight: 700;
        }

        .btn-show-answer {
            background: #1e293b;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .btn-show-answer:hover {
            background: #f59e0b;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.3);
        }

        .btn-show-answer.showing {
            background: #22c55e;
        }

        .btn-show-answer.showing:hover {
            background: #16a34a;
        }

        .answer-box {
            margin-top: 12px;
            padding: 14px 20px;
            background: #fffbeb;
            border-radius: 12px;
            border-right: 4px solid #f59e0b;
            display: none;
            font-size: 18px;
            color: #1f2937;
            line-height: 1.8;
        }

        .answer-box.show {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        .answer-box .ans-label {
            color: #f59e0b;
            font-weight: 700;
        }

        .answer-box .explanation {
            color: #6b7280;
            font-size: 17px;
            margin-top: 4px;
        }

        .answer-box .explanation i {
            color: #f59e0b;
            margin-left: 6px;
        }

        .quiz-divider {
            border: none;
            border-top: 2px dashed #fde68a;
            margin: 18px 0;
        }

        @media (max-width: 1024px) {
            .slide-title {
                font-size: 32px;
            }
            .card p,
            .card li {
                font-size: 20px;
            }
            .concept-map .node {
                font-size: 18px;
                padding: 8px 20px;
                min-width: 150px;
            }
            .two-col {
                grid-template-columns: 1fr;
            }
            .three-col {
                grid-template-columns: 1fr 1fr;
            }
            .steps-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .presentation-container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                max-width: 100vw;
            }
            .slide-content {
                padding: 14px 16px 10px 16px;
            }
            .slide-title {
                font-size: 24px;
            }
            .card p,
            .card li {
                font-size: 17px;
            }
            .card ul li {
                font-size: 17px;
                padding-right: 24px;
            }
            .two-col,
            .three-col,
            .steps-grid {
                grid-template-columns: 1fr;
            }
            .trainer-avatar {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
            .trainer-details h4 {
                font-size: 17px;
            }
            .trainer-details .sub {
                font-size: 13px;
            }
            .btn span {
                display: none;
            }
            .cover-decoration {
                display: none;
            }
            .concept-map .node {
                font-size: 15px;
                padding: 6px 14px;
                min-width: 120px;
            }
            .concept-map .arrow {
                font-size: 20px;
            }
            .punchline {
                font-size: 18px;
            }
            .slide-counter {
                font-size: 14px;
                padding: 4px 14px;
            }
            .quiz-item .question-text {
                font-size: 16px;
            }
            .quiz-item .question-text .sub-q {
                font-size: 15px;
                padding-right: 0;
            }
            .btn-show-answer {
                font-size: 13px;
                padding: 6px 14px;
            }
            .answer-box {
                font-size: 16px;
                padding: 10px 14px;
            }
            .quiz-section-title {
                font-size: 24px;
            }
            .table-wrapper table {
                font-size: 15px;
            }
            .table-wrapper th,
            .table-wrapper td {
                padding: 8px 10px;
                font-size: 15px;
            }
            .image-placeholder {
                max-width: 250px;
            }
        }

        @media (max-width: 480px) {
            .slide-title {
                font-size: 20px;
            }
            .card {
                padding: 14px 16px;
            }
            .card p,
            .card li {
                font-size: 15px;
            }
            .quiz-item .question-text {
                font-size: 15px;
            }
            .answer-box {
                font-size: 14px;
            }
            .table-wrapper table {
                font-size: 13px;
            }
            .table-wrapper th,
            .table-wrapper td {
                padding: 6px 8px;
                font-size: 13px;
            }
            .image-placeholder {
                max-width: 180px;
            }
        }
    </style>
</head>
<body>

    <div class="presentation-container" id="app">
        <!-- Decorative Elements -->
        <div class="cover-decoration top-right">
            // مستر عبدو برمجة<br>
            // From Logic to Innovation
        </div>
        <div class="cover-decoration bottom-left">
            🔐 التشفير<br>
            🛡️ المصادقة<br>
            🔒 HTTPS<br>
            🎫 الشهادات الرقمية
        </div>

        <div class="slide-content" id="slideContent">
            <!-- Trainer Bar -->
            <div class="trainer-bar">
                <div class="trainer-info">
                    <div class="trainer-avatar">ع</div>

            } else {
                answerBox.classList.add('show');
                button.textContent = 'إخفاء الإجابة';
                button.classList.add('showing');
            }
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderSlide(index) {
            const slide = slides[index];
            if (!slide) return;

            let html = `
                <div class="slide-title slide-enter">
                    <span class="icon">${slide.icon}</span>
                    ${slide.title}
                    <span class="subtitle-line">// ${String(index + 1).padStart(2, '0')}</span>
                </div>
                <div class="divider"></div>
                <div class="fade-in" style="flex:1;display:flex;flex-direction:column;justify-content:center;">
                    ${slide.content}
                </div>
            `;
            slideBody.innerHTML = html;

            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });

            slideCounter.textContent = `${String(index + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;

            prevBtn.disabled = index === 0;
            prevBtn.style.opacity = index === 0 ? '0.3' : '1';
        }

        function renderDots() {
            dotsContainer.innerHTML = '';
            slides.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'dot' + (i === currentSlide ? ' active' : '');
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            });
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        function goToSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentSlide = index;
            renderSlide(currentSlide);
            renderDots();
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                goToSlide(currentSlide + 1);
            } else if (autoPlay) {
                goToSlide(0);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) goToSlide(currentSlide - 1);
        }

        // ============================================================
        //  AUTOPLAY
        // ============================================================
        function toggleAutoPlay() {
            autoPlay = !autoPlay;
            if (autoPlay) {
                autoInterval = setInterval(nextSlide, 6000);
                autoBtn.innerHTML = '<i class="fas fa-pause"></i> <span>إيقاف</span>';
                autoBtn.classList.add('btn-primary');
            } else {
                clearInterval(autoInterval);
                autoBtn.innerHTML = '<i class="fas fa-play"></i> <span>تلقائي</span>';
                autoBtn.classList.remove('btn-primary');
            }
        }

        // ============================================================
        //  FULLSCREEN
        // ============================================================
        function toggleFullscreen() {
            const container = document.querySelector('.presentation-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {});
            } else {
                document.exitFullscreen().catch(err => {});
            }
        }

        // ============================================================
        //  KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                toggleAutoPlay();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
        });

        // ============================================================
        //  EVENT LISTENERS
        // ============================================================
        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);
        autoBtn.addEventListener('click', toggleAutoPlay);
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // ============================================================
        //  INIT
        // ============================================================
        renderDots();
        renderSlide(0);
    </script>

</body>
</html>
