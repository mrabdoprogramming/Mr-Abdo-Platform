<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستر عبدو برمجة - تطور تكنولوجيا المعلومات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #e8ecf1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .presentation-container {
            width: 1366px;
            max-width: 98vw;
            height: 768px;
            max-height: 98vh;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .cover-decoration {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            opacity: 0.04;
            font-family: 'Cairo', sans-serif;
            color: #1e293b;
            font-size: 14px;
            line-height: 2;
        }

        .cover-decoration.top-right {
            top: 30px;
            right: 40px;
            text-align: right;
            font-size: 13px;
            opacity: 0.05;
        }

        .cover-decoration.bottom-left {
            bottom: 30px;
            left: 40px;
            font-size: 13px;
            opacity: 0.05;
        }

        .slide-content {
            position: relative;
            z-index: 1;
            flex: 1;
            padding: 28px 48px 20px 48px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .trainer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 3px solid #f0f2f5;
            flex-shrink: 0;
        }

        .trainer-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .trainer-avatar {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: linear-gradient(135deg, #1e293b, #f59e0b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            font-weight: 900;
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.3);
            border: 3px solid #f59e0b;
        }

        .trainer-details h4 {
            color: #1e293b;
            font-size: 22px;
            font-weight: 900;
            line-height: 1.2;
        }

        .trainer-details h4 span {
            color: #f59e0b;
        }

        .trainer-details .sub {
            color: #6b7280;
            font-size: 16px;
            font-weight: 400;
            margin-top: 2px;
        }

        .trainer-details .sub i {
            color: #f59e0b;
            margin-left: 6px;
        }

        .slide-counter {
            color: #9ca3af;
            font-size: 18px;
            font-weight: 700;
            background: #f3f4f6;
            padding: 6px 22px;
            border-radius: 24px;
            font-family: 'Cairo', sans-serif;
        }

        .slide-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 6px 0;
        }

        .slide-title {
            font-size: 40px;
            font-weight: 900;
            color: #1e293b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .slide-title .icon {
            font-size: 38px;
        }

        .slide-title .highlight {
            color: #f59e0b;
        }

        .slide-title .subtitle-line {
            font-size: 18px;
            font-weight: 400;
            color: #9ca3af;
            margin-right: 14px;
        }

        .divider {
            width: 80px;
            height: 5px;
            background: linear-gradient(90deg, #f59e0b, #1e293b);
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 26px 32px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
            border: 1px solid #f0f2f5;
        }

        .card:hover {
            box-shadow: 0 10px 40px rgba(245, 158, 11, 0.08);
            transform: translateY(-2px);
            border-color: #f59e0b;
        }

        .card p,
        .card li {
            color: #1f2937;
            font-size: 24px;
            line-height: 2;
        }

        .card ul {
            list-style: none;
            padding: 0;
        }

        .card ul li {
            padding: 6px 0;
            padding-right: 34px;
            position: relative;
            font-size: 23px;
        }

        .card ul li::before {
            content: "▸";
            position: absolute;
            right: 0;
            color: #f59e0b;
            font-weight: 700;
            font-size: 26px;
        }

        .example-box {
            background: #fffbeb;
            border-radius: 16px;
            padding: 18px 24px;
            margin-top: 14px;
            border-right: 5px solid #f59e0b;
        }

        .example-box .label {
            color: #6b7280;
            font-size: 18px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        .example-box .content {
            color: #1f2937;
            font-size: 22px;
            line-height: 1.8;
        }

        .punchline {
            margin-top: 16px;
            padding: 14px 22px;
            background: #fffbeb;
            border-radius: 14px;
            border-right: 5px solid #f59e0b;
            font-size: 24px;
            color: #1e293b;
            font-weight: 700;
        }

        .punchline i {
            color: #f59e0b;
            margin-left: 12px;
            font-size: 26px;
        }

        .concept-map {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 0;
        }

        .concept-map .node {
            background: #fffbeb;
            padding: 10px 30px;
            border-radius: 14px;
            border: 2px solid #fde68a;
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            transition: all 0.3s ease;
            min-width: 200px;
            text-align: center;
        }

        .concept-map .node:hover {
            border-color: #f59e0b;
            background: #fde68a;
        }

        .concept-map .node.highlight {
            border-color: #f59e0b;
            background: #fde68a;
        }

        .concept-map .arrow {
            color: #f59e0b;
            font-size: 28px;
            opacity: 0.6;
        }

        .concept-map .row {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* ===== TABLE STYLES ===== */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 12px;
            border-radius: 14px;
            border: 1px solid #f0f2f5;
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 20px;
            font-family: 'Cairo', sans-serif;
        }

        .table-wrapper thead {
            background: #f59e0b;
            color: #fff;
        }

        .table-wrapper th {
            padding: 14px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            border: 1px solid #f59e0b;
        }

        .table-wrapper td {
            padding: 12px 18px;
            text-align: center;
            border: 1px solid #e5e7eb;
            color: #1f2937;
            font-size: 19px;
            line-height: 1.6;
        }

        .table-wrapper tr:nth-child(even) {
            background: #fffbeb;
        }

        .table-wrapper tr:hover {
            background: #fde68a;
        }

        .table-wrapper .highlight-cell {
            font-weight: 700;
            color: #f59e0b;
        }

        /* ===== TIMELINE ===== */
        .timeline-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 10px;
        }

        .timeline-item {
            background: #fffbeb;
            padding: 16px 20px;
            border-radius: 14px;
            border-right: 4px solid #f59e0b;
            transition: all 0.3s ease;
        }

        .timeline-item:hover {
            background: #fde68a;
            transform: translateX(-3px);
        }

        .timeline-item .period {
            font-size: 18px;
            font-weight: 800;
            color: #f59e0b;
        }

        .timeline-item .title {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-top: 2px;
        }

        .timeline-item .desc {
            font-size: 16px;
            color: #6b7280;
            margin-top: 4px;
        }

        /* ===== SOCIAL CHANGE GRID ===== */
        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .social-item {
            background: #fffbeb;
            padding: 16px 14px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #fde68a;
            transition: all 0.3s ease;
        }

        .social-item:hover {
            transform: translateY(-3px);
            background: #fde68a;
            border-color: #f59e0b;
        }

        .social-item .emoji {
            font-size: 32px;
            display: block;
            margin-bottom: 4px;
        }

        .social-item .name {
            font-size: 16px;
            font-weight: 800;
            color: #1e293b;
        }

        .social-item .desc {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        /* ===== TECH GRID ===== */
        .tech-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-top: 10px;
        }

        .tech-item {
            background: #fffbeb;
            padding: 18px 20px;
            border-radius: 14px;
            border-top: 4px solid #f59e0b;
            transition: all 0.3s ease;
        }

        .tech-item:hover {
            transform: translateY(-3px);
            background: #fde68a;
        }

        .tech-item .name {
            font-size: 18px;
            font-weight: 800;
            color: #1e293b;
            text-align: center;
        }

        .tech-item .desc {
            font-size: 16px;
            color: #6b7280;
            margin-top: 6px;
        }

        /* ===== MOORE'S LAW ===== */
        .moore-box {
            background: #fffbeb;
            padding: 18px 24px;
            border-radius: 14px;
            border-right: 5px solid #f59e0b;
            margin-top: 10px;
        }

        .moore-box .title {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
        }

        .moore-box .desc {
            font-size: 18px;
            color: #1f2937;
            margin-top: 4px;
        }

        .moore-box .challenges {
            font-size: 16px;
            color: #6b7280;
            margin-top: 6px;
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 3px solid #f0f2f5;
            flex-shrink: 0;
        }

        .dots {
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #d1d5db;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            background: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
            width: 36px;
            border-radius: 8px;
        }

        .dot:hover {
            background: #f59e0b;
            opacity: 0.6;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 10px 22px;
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            background: #e5e7eb;
            border-color: #f59e0b;
            color: #1e293b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .btn-primary {
            background: #1e293b;
            border: none;
            color: #fff;
        }

        .btn-primary:hover {
            background: #f59e0b;
            color: #fff;
            box-shadow: 0 6px 24px rgba(245, 158, 11, 0.3);
        }

        .btn-icon {
            width: 48px;
            height: 48px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
            font-size: 18px;
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-enter {
            animation: slideEnter 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes slideEnter {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .slide-content::-webkit-scrollbar {
            width: 5px;
        }
        .slide-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .slide-content::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }

        /* Quiz Styles */
        .quiz-section-title {
            font-size: 32px;
            font-weight: 900;
            color: #1e293b;
            text-align: center;
            margin-bottom: 16px;
        }

        .quiz-section-title .icon {
            font-size: 36px;
        }

        .quiz-section-title .sub {
            font-size: 18px;
            color: #6b7280;
            font-weight: 400;
            display: block;
            margin-top: 4px;
        }

        .quiz-item {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px 26px;
            margin-bottom: 16px;
            border: 2px solid #eef2f6;
            transition: all 0.3s ease;
            position: relative;
        }

        .quiz-item:last-child {
            margin-bottom: 0;
        }

        .quiz-item:hover {
            border-color: #f59e0b;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.08);
        }

        .quiz-item .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .quiz-item .question-text {
            font-size: 20px;
            color: #1e293b;
            font-weight: 700;
            line-height: 1.8;
            flex: 1;
        }

        .quiz-item .question-text .q-num {
            color: #f59e0b;
            font-weight: 900;
            margin-left: 8px;
        }

        .quiz-item .question-text .sub-q {
            font-weight: 400;
            color: #4b5563;
            font-size: 18px;
            display: block;
            padding-right: 30px;
            margin-top: 4px;
        }

        .quiz-item .question-text .sub-q .letter {
            color: #f59e0b;
            font-weight: 700;
        }

        .btn-show-answer {
            background: #1e293b;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .btn-show-answer:hover {
            background: #f59e0b;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.3);
        }

        .btn-show-answer.showing {
            background: #f59e0b;
        }

        .btn-show-answer.showing:hover {
            background: #d97706;
        }

        .answer-box {
            margin-top: 12px;
            padding: 14px 20px;
            background: #fffbeb;
            border-radius: 12px;
            border-right: 4px solid #f59e0b;
            display: none;
            font-size: 18px;
            color: #1f2937;
            line-height: 1.8;
        }

        .answer-box.show {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        .answer-box .ans-label {
            color: #f59e0b;
            font-weight: 700;
        }

        .answer-box .explanation {
            color: #6b7280;
            font-size: 17px;
            margin-top: 4px;
        }

        .answer-box .explanation i {
            color: #f59e0b;
            margin-left: 6px;
        }

        .quiz-divider {
            border: none;
            border-top: 2px dashed #fde68a;
            margin: 18px 0;
        }

        @media (max-width: 1024px) {
            .slide-title {
                font-size: 32px;
            }
            .card p,
            .card li {
                font-size: 20px;
            }
            .concept-map .node {
                font-size: 18px;
                padding: 8px 20px;
                min-width: 150px;
            }
            .social-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .tech-grid {
                grid-template-columns: 1fr 1fr;
            }
            .timeline-grid {
                grid-template-columns: 1fr;
            }
            .table-wrapper table {
                font-size: 17px;
            }
        }

        @media (max-width: 768px) {
            .presentation-container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                max-width: 100vw;
            }
            .slide-content {
                padding: 14px 16px 10px 16px;
            }
            .slide-title {
                font-size: 24px;
            }
            .card p,
            .card li {
                font-size: 17px;
            }
            .card ul li {
                font-size: 17px;
                padding-right: 24px;
            }
            .social-grid {
                grid-template-columns: 1fr 1fr;
            }
            .tech-grid {
                grid-template-columns: 1fr;
            }
            .timeline-grid {
                grid-template-columns: 1fr;
            }
            .trainer-avatar {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
            .trainer-details h4 {
                font-size: 17px;
            }
            .trainer-details .sub {
                font-size: 13px;
            }
            .btn span {
                display: none;
            }
            .cover-decoration {
                display: none;
            }
            .concept-map .node {
                font-size: 15px;
                padding: 6px 14px;
                min-width: 120px;
            }
            .concept-map .arrow {
                font-size: 20px;
            }
            .punchline {
                font-size: 18px;
            }
            .slide-counter {
                font-size: 14px;
                padding: 4px 14px;
            }
            .quiz-item .question-text {
                font-size: 16px;
            }
            .quiz-item .question-text .sub-q {
                font-size: 15px;
                padding-right: 0;
            }
            .btn-show-answer {
                font-size: 13px;
                padding: 6px 14px;
            }
            .answer-box {
                font-size: 16px;
                padding: 10px 14px;
            }
            .quiz-section-title {
                font-size: 24px;
            }
            .table-wrapper table {
                font-size: 15px;
            }
            .table-wrapper th,
            .table-wrapper td {
                padding: 8px 10px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .slide-title {
                font-size: 20px;
            }
            .card {
                padding: 14px 16px;
            }
            .card p,
            .card li {
                font-size: 15px;
            }
            .social-grid {
                grid-template-columns: 1fr;
            }
            .quiz-item .question-text {
                font-size: 15px;
            }
            .answer-box {
                font-size: 14px;
            }
            .table-wrapper table {
                font-size: 13px;
            }
            .table-wrapper th,
            .table-wrapper td {
                padding: 6px 8px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="presentation-container" id="app">
        <!-- Decorative Elements -->
        <div class="cover-decoration top-right">
            // مستر عبدو برمجة<br>
            // From Logic to Innovation
        </div>
        <div class="cover-decoration bottom-left">
            📚 تطور تكنولوجيا المعلومات<br>
            📊 قانون مور<br>
            🌐 التحول الاجتماعي<br>
            🚀 تقنيات ناشئة
        </div>

        <div class="slide-content" id="slideContent">
            <!-- Trainer Bar -->
            <div class="trainer-bar">
                <div class="trainer-info">
                    <div class="trainer-avatar">ع</div>
                    <div class="trainer-details">
                        <h4>مستر <span>عبدو</span> برمجة</h4>
                        <div class="sub"><i class="fas fa-code"></i> تطور تكنولوجيا المعلومات · الصف الثاني الثانوي · الوحدة الأولى · الدرس الأول</div>
                    </div>
                </div>
                <div class="slide-counter" id="slideCounter">٠١ / ٠٧</div>
            </div>

            <!-- Slide Body -->
            <div class="slide-body" id="slideBody"></div>

            <!-- Controls -->
            <div class="controls">
                <div class="dots" id="dotsContainer"></div>
                <div class="btn-group">
                    <button class="btn btn-icon" id="prevBtn" title="السابق"><i class="fas fa-chevron-right"></i></button>
                    <button class="btn btn-icon" id="nextBtn" title="التالي"><i class="fas fa-chevron-left"></i></button>
                    <button class="btn" id="autoBtn" title="تشغيل تلقائي"><i class="fas fa-play"></i> <span>تلقائي</span></button>
                    <button class="btn btn-primary btn-icon" id="fullscreenBtn" title="عرض كامل"><i class="fas fa-expand"></i></button>
                </div>
            </div>
        </div>

                            <span class="sub-q">"ظهرت الحواسيب الإلكترونية في أربعينيات القرن العشرين، واستُخدمت أولاً في أغراض عسكرية وحسابات علمية. ثم انتشرت (1) في السبعينيات والثمانينيات، فبدأ استخدامها على نطاق أوسع بين الأفراد. وفي التسعينيات أُتيح (2) للاستخدام التجاري وانتشر الويب، فتوسع الوصول العالمي إلى المعلومات. وفي العقد الأول من الألفية ظهرت (3)، فانتشر الإنترنت عبر الهواتف المحمولة بسرعة."</span>
                            <span class="sub-q">• املأ الفراغات (1 - 3).</span>
                            <span class="sub-q">• ما التقنية التي انتشرت من العقد الثاني من الألفية فصاعداً، والتي تدعم تحليل البيانات الضخمة واستخدام الذكاء الاصطناعي؟</span>
                        </div>
                        <button class="btn-show-answer" onclick="toggleAnswer(this)">إظهار الإجابة</button>
                    </div>
                    <div class="answer-box">
                        <span class="ans-label">✅ الإجابة:</span>
                        (1) الحواسب الشخصية (PCs)<br>
                        (2) الإنترنت<br>
                        (3) الهواتف الذكية<br><br>
                        التقنية التي انتشرت من العقد الثاني: <span style="font-weight:700;color:#f59e0b;">الحوسبة السحابية</span>
                        <div class="explanation"><i class="fas fa-arrow-left"></i> الحوسبة السحابية دعمت تحليل البيانات الضخمة والذكاء الاصطناعي</div>
                    </div>
                </div>

                <!-- السؤال 9 -->
                <div class="quiz-item">
                    <div class="question-header">
                        <div class="question-text">
                            <span class="q-num">9.</span> من بين الخيارات التالية (أ - و)، اختر كل ما يُعد من التقنيات الناشئة:
                            <span class="sub-q">(أ) البريد الإلكتروني - (ب) القيادة الذاتية - (ج) الحواسب الشخصية - (د) الواقع المعزز - (هـ) الواقع الافتراضي - (و) الحوسبة الكمومية</span>
                        </div>
                        <button class="btn-show-answer" onclick="toggleAnswer(this)">إظهار الإجابة</button>
                    </div>
                    <div class="answer-box">
                        <span class="ans-label">✅ الإجابة:</span>
                        (ب) القيادة الذاتية · (د) الواقع المعزز · (هـ) الواقع الافتراضي · (و) الحوسبة الكمومية
                        <div class="explanation"><i class="fas fa-arrow-left"></i> البريد الإلكتروني والحواسب الشخصية من التقنيات القديمة وليست ناشئة</div>
                    </div>
                </div>

                <!-- السؤال 10 -->
                <div class="quiz-item">
                    <div class="question-header">
                        <div class="question-text">
                            <span class="q-num">10.</span> من بين الخيارات التالية (أ - د)، اختر الخيار الذي يصف بشكل أنسب خصائص شبكات التواصل الاجتماعي:
                            <span class="sub-q"><span class="letter">(أ)</span> خدمة تتيح للمستخدمين التواصل فيما بينهم ونشر المعلومات ومشاركتها، وهي فعالة جداً في نشر المعلومات بسرعة.</span>
                            <span class="sub-q"><span class="letter">(ب)</span> خدمة لبيع السلع والخدمات وشرائها عبر الإنترنت.</span>
                            <span class="sub-q"><span class="letter">(ج)</span> أسلوب يعمل فيه الشخص من المنزل أو من مواقع بعيدة أخرى.</span>
                            <span class="sub-q"><span class="letter">(د)</span> نظام لإجراء المدفوعات بالنقود الإلكترونية أو رموز QR دون استخدام النقد.</span>
                        </div>
                        <button class="btn-show-answer" onclick="toggleAnswer(this)">إظهار الإجابة</button>
                    </div>
                    <div class="answer-box">
                        <span class="ans-label">✅ الإجابة:</span> (أ)
                        <div class="explanation"><i class="fas fa-arrow-left"></i> شبكات التواصل الاجتماعي تتيح التواصل ونشر المعلومات ومشاركتها بسرعة</div>
                    </div>
                </div>

                <hr class="quiz-divider">

                <div style="text-align:center;color:#6b7280;font-size:16px;margin-top:8px;">
                    <i class="fas fa-lightbulb" style="color:#f59e0b;"></i> حاول الإجابة بنفسك قبل الضغط على زر الإجابة
                </div>
            `
        }];

        // ============================================================
        //  STATE
        // ============================================================
        let currentSlide = 0;
        let autoPlay = false;
        let autoInterval = null;

        // ============================================================
        //  DOM REFS
        // ============================================================
        const slideBody = document.getElementById('slideBody');
        const dotsContainer = document.getElementById('dotsContainer');
        const slideCounter = document.getElementById('slideCounter');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const autoBtn = document.getElementById('autoBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // ============================================================
        //  TOGGLE ANSWER FUNCTION
        // ============================================================
        function toggleAnswer(button) {
            const answerBox = button.closest('.quiz-item').querySelector('.answer-box');
            const isShowing = answerBox.classList.contains('show');

            if (isShowing) {
                answerBox.classList.remove('show');
                button.textContent = 'إظهار الإجابة';
                button.classList.remove('showing');
            } else {
                answerBox.classList.add('show');
                button.textContent = 'إخفاء الإجابة';
                button.classList.add('showing');
            }
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderSlide(index) {
            const slide = slides[index];
            if (!slide) return;

            let html = `
                <div class="slide-title slide-enter">
                    <span class="icon">${slide.icon}</span>
                    ${slide.title}
                    <span class="subtitle-line">// ${String(index + 1).padStart(2, '0')}</span>
                </div>
                <div class="divider"></div>
                <div class="fade-in" style="flex:1;display:flex;flex-direction:column;justify-content:center;">
                    ${slide.content}
                </div>
            `;
            slideBody.innerHTML = html;

            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });

            slideCounter.textContent = `${String(index + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;

            prevBtn.disabled = index === 0;
            prevBtn.style.opacity = index === 0 ? '0.3' : '1';
        }

        function renderDots() {
            dotsContainer.innerHTML = '';
            slides.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'dot' + (i === currentSlide ? ' active' : '');
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            });
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        function goToSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentSlide = index;
            renderSlide(currentSlide);
            renderDots();
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                goToSlide(currentSlide + 1);
            } else if (autoPlay) {
                goToSlide(0);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) goToSlide(currentSlide - 1);
        }

        // ============================================================
        //  AUTOPLAY
        // ============================================================
        function toggleAutoPlay() {
            autoPlay = !autoPlay;
            if (autoPlay) {
                autoInterval = setInterval(nextSlide, 6000);
                autoBtn.innerHTML = '<i class="fas fa-pause"></i> <span>إيقاف</span>';
                autoBtn.classList.add('btn-primary');
            } else {
                clearInterval(autoInterval);
                autoBtn.innerHTML = '<i class="fas fa-play"></i> <span>تلقائي</span>';
                autoBtn.classList.remove('btn-primary');
            }
        }

        // ============================================================
        //  FULLSCREEN
        // ============================================================
        function toggleFullscreen() {
            const container = document.querySelector('.presentation-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {});
            } else {
                document.exitFullscreen().catch(err => {});
            }
        }

        // ============================================================
        //  KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                toggleAutoPlay();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
        });

        // ============================================================
        //  EVENT LISTENERS
        // ============================================================
        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);
        autoBtn.addEventListener('click', toggleAutoPlay);
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // ============================================================
        //  INIT
        // ============================================================
        renderDots();
        renderSlide(0);
    </script>

</body>
</html>
